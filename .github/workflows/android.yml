name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create the Android project
        run: |
          mkdir -p "android/app"
          cat > "android/app/build.gradle" <<'PROJECT_EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'il.mutzlach.runtracker'
              compileSdk 34
              defaultConfig {
                  applicationId 'il.mutzlach.runtracker'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
                  versionName '1.' + (System.getenv('VERSION_CODE') ?: '1')
              }
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv('KEY_PASS')
                      keyAlias 'runtracker'
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }

          PROJECT_EOF
          mkdir -p "android/app/src/main"
          cat > "android/app/src/main/AndroidManifest.xml" <<'PROJECT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>

          PROJECT_EOF
          mkdir -p "android/app/src/main/java/il/mutzlach/runtracker"
          cat > "android/app/src/main/java/il/mutzlach/runtracker/MainActivity.java" <<'PROJECT_EOF'
          package il.mutzlach.runtracker;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final String START_URL = "https://mutzlach-il.github.io/run-tracker/";
              private static final String HOST = "mutzlach-il.github.io";
              private static final int REQ_LOCATION = 1;
              private static final int REQ_FILE = 2;

              private WebView web;
              private String geoOrigin;
              private GeolocationPermissions.Callback geoCallback;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#e0541f"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#f3f5f2"));
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setUserAgentString(s.getUserAgentString() + " RunTrackerApp/1");

                  web.addJavascriptInterface(new Bridge(), "AndroidApp");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (hasLocation()) {
                              callback.invoke(origin, true, true);
                          } else {
                              geoOrigin = origin;
                              geoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType("*/*");
                              startActivityForResult(Intent.createChooser(i, "בחר קובץ גיבוי"), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(START_URL);
                  }

                  if (!hasLocation()) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                  }
              }

              private boolean hasLocation() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(requestCode, permissions, results);
                  if (requestCode == REQ_LOCATION && geoCallback != null) {
                      geoCallback.invoke(geoOrigin, hasLocation(), true);
                      geoCallback = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              /** פונקציות שהדף יכול לקרוא להן: מסך דולק ושמירת גיבוי */
              class Bridge {
                  @JavascriptInterface
                  public void keepScreenOn(final boolean on) {
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String saveFile(String name, String content) {
                      try {
                          byte[] bytes = content.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (uri == null) return "error";
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              os.write(bytes);
                              os.close();
                              toast("הגיבוי נשמר בתיקיית ההורדות: " + name);
                              return "ok";
                          } else {
                              File dir = getExternalFilesDir(null);
                              File f = new File(dir, name);
                              FileOutputStream fos = new FileOutputStream(f);
                              fos.write(bytes);
                              fos.close();
                              toast("הגיבוי נשמר: " + f.getAbsolutePath());
                              return "ok";
                          }
                      } catch (Exception e) {
                          return "error";
                      }
                  }

                  @JavascriptInterface
                  public boolean isApp() { return true; }
              }

              private void toast(final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override public void run() { Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show(); }
                  });
              }
          }

          PROJECT_EOF
          mkdir -p "android/app/src/main/res/values"
          cat > "android/app/src/main/res/values/strings.xml" <<'PROJECT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">מד ריצה</string>
          </resources>

          PROJECT_EOF
          mkdir -p "android"
          cat > "android/build.gradle" <<'PROJECT_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }

          PROJECT_EOF
          mkdir -p "android"
          cat > "android/gradle.properties" <<'PROJECT_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false

          PROJECT_EOF
          mkdir -p "android"
          cat > "android/settings.gradle" <<'PROJECT_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RunTracker"
          include ':app'

          PROJECT_EOF
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: One-time signing key (never saved)
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          echo "KEY_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 -alias runtracker -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Keter Technologies, O=Keter, C=IL"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../run-tracker.apk
          rm -f app/release.jks

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app run-tracker.apk --title "מד ריצה – אפליקציה לאנדרואיד" --notes "להורדה ולהתקנה בטלפון" --latest
